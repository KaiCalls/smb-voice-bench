name: Signed GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: voice-bench-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'KaiCalls/smb-voice-bench'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify version tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) and tag == 'v' + version
          assert Path('docs/releases/' + tag + '.md').is_file()
          PY
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m build --no-isolation
      - run: python tools/check_public.py --dist dist
      - run: python -m venv "$RUNNER_TEMP/release-env"
      - run: '"$RUNNER_TEMP/release-env/bin/python" -m pip install --require-hashes -r requirements.lock'
      - run: '"$RUNNER_TEMP/release-env/bin/python" -m pip install --no-deps dist/*.whl'
      - run: '"$RUNNER_TEMP/release-env/bin/python" -m unittest discover -s tests -v'
      - name: Verify installed release workflow
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/release-env/bin/python" "$GITHUB_WORKSPACE/tools/verify_install.py" --output ./release-acceptance'
      - name: Prepare locked dependencies and checksums
        run: |
          cp requirements.lock dist/requirements.lock
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          paths = sorted(root.iterdir())
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in paths))
          PY
      - name: Sign build provenance
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*
          create-storage-record: false
      - name: Publish tested release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" dist/provenance.sigstore.json
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "SMB voice bench $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
