name: offline-package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: smb-voice-bench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python tools/check_public.py
      - run: python -m build --no-isolation
      - run: python tools/check_public.py --dist dist
      - run: python -m venv "$RUNNER_TEMP/wheel-env"
      - run: '"$RUNNER_TEMP/wheel-env/bin/python" -m pip install --require-hashes -r requirements.lock'
      - run: '"$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps dist/*.whl'
      - run: '"$RUNNER_TEMP/wheel-env/bin/python" -m unittest discover -s tests -v'
      - name: Installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-env/bin/smb-voice-bench" doctor --json
          "$RUNNER_TEMP/wheel-env/bin/smb-voice-bench" catalog --json
          "$RUNNER_TEMP/wheel-env/bin/smb-voice-bench" demo --output ./demo-report --json
